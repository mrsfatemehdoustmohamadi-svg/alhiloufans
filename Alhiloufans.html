:root{box-sizing:border-box; color-scheme:dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:#05070d; color:#fff; font-family:"Vazirmatn",Tahoma,"Segoe UI",Arial,sans-serif; display:flex; justify-content:center; padding:44px 18px 36px; position:relative; overflow-x:hidden}
.bg{position:fixed; top:-40px; left:-40px; width:calc(100% + 80px); height:calc(100% + 80px); object-fit:cover; filter:blur(38px) saturate(1.35) brightness(.6); z-index:-2}
.shade{position:fixed; inset:0; background:linear-gradient(180deg,rgba(5,7,13,.30) 0%,rgba(5,7,13,.82) 100%); z-index:-1}
main{width:100%; max-width:440px; text-align:center}
.ring{width:132px; height:132px; margin:0 auto 18px; border-radius:50%; box-shadow:0 0 0 3px rgba(255,255,255,.22),0 12px 40px rgba(0,0,0,.55)}
.ring img{width:100%; height:100%; display:block; border-radius:50%; object-fit:cover}
h1{margin:0 0 12px; font-family:'AFTitle',Impact,'Arial Black',sans-serif; font-weight:400; font-size:38px; line-height:1.1; letter-spacing:2px; text-transform:uppercase; direction:ltr; color:#fff; text-shadow:0 3px 0 #22366f,0 0 16px rgba(34,54,111,.8)}
.sub{display:inline-block; margin:0 0 28px; padding:7px 18px; border-radius:999px; font-size:14px; color:rgba(255,255,255,.85); background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
.list{display:flex; flex-direction:column; gap:12px}
a.card{display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:22px; color:#fff; text-decoration:none; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); box-shadow:0 8px 24px rgba(0,0,0,.28); transition:transform .18s ease, background .18s ease}
a.card:hover,a.card:focus-visible{transform:translateY(-3px); background:rgba(255,255,255,.16); outline:none}
.icw{display:block; width:48px; height:48px; flex:none}
.ic{width:48px; height:48px; border-radius:15px; background:var(--c); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.35)}
.ic svg{width:24px; height:24px}
.txt{flex:1; text-align:right; display:flex; flex-direction:column; gap:2px}
.nm{display:flex; align-items:baseline; gap:8px}
.nm em{font-style:normal; font-size:13px; letter-spacing:.3px; color:rgba(255,255,255,.6); direction:ltr; font-family:Arial,Helvetica,sans-serif}
.txt b{font-weight:600; font-size:17px}
.txt small{font-size:13px; color:rgba(255,255,255,.62); direction:ltr; text-align:right}
.chev{width:9px; height:9px; border-left:2px solid rgba(255,255,255,.6); border-bottom:2px solid rgba(255,255,255,.6); transform:rotate(45deg); margin-inline-end:6px}
footer{margin-top:26px; font-size:13px; color:rgba(255,255,255,.55)}
</style>
</head>
